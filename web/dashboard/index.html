<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"> <!-- Flatpickr CSS -->
</head>
<body>
    <header>
        <h1>Notification Dashboard</h1>
        <div class="theme-switcher">
            <button id="theme-toggle">Toggle Dark/Light Mode</button>
        </div>
    </header>
    <main>
        <section id="global-stats" class="container">
            <h2><i class="fas fa-globe-americas"></i>Global Stats</h2>
            <div class="stats-cards">
                <div class="card">
                    <h3>Total Notifications Sent</h3>
                    <p id="total-sent">10,250</p>
                </div>
                <div class="card">
                    <h3>Total Failed Notifications</h3>
                    <p id="total-failed">150</p>
                </div>
                <div class="card">
                    <h3>Notifications in Queue</h3>
                    <p id="in-queue">35</p>
                </div>
                <div class="card">
                    <h3>Avg. Time to Deliver</h3>
                    <p id="avg-delivery-time">2.5s</p>
                </div>
                <div class="card">
                    <h3>Success Rate</h3>
                    <p id="success-rate">98.5%</p>
                </div>
            </div>
        </section>

 
        <!-- More sections will go here -->
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script> <!-- Flatpickr for date range -->
    <footer>
        <p>&copy; 2024 Notification System</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
